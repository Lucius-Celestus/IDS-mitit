apiVersion: 1
datasources:
  - name: InfluxDB_v2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: soc
      defaultBucket: traffic
      tlsSkipVerify: true
    secureJsonData:
      token: supersecret-auth-token # Тот же, что в .env