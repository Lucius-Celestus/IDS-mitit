services:
  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    network_mode: "host"
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
      - BLOCK_MODE=shadow
      - ALERT_THRESHOLD=0.5

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    network_mode: "host"
    volumes:
      - ./data:/app/data:rw
    environment:
      - IFACE=wlp3s0
      - BRAIN_ADDR=http://127.0.0.1:50051
      - BLOCK_MODE=shadow
    privileged: true

  eye:
    build:
      context: .
      dockerfile: eye/Dockerfile
    network_mode: "host"
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1

  retrainer:
    build:
      context: .
      dockerfile: brain/Dockerfile
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: >
      bash -c "
      while true; do
        echo '[*] Running model retraining...'
        python /app/src/training.py 2>&1 || echo 'Retraining cycle failed'
        sleep 3600
      done
      "
    depends_on:
      - brain